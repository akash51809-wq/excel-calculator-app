<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - DayBook Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-dark { background-color: #1e1e1e; border: 1px solid #333; border-radius: 10px; }
    .table-dark-custom { background-color: #1e1e1e; color: #fff; }
    .table-dark-custom th { background-color: #2a2a2a; border-color: #444; }
    .table-dark-custom td { border-color: #333; }
  </style>
</head>
<body class="p-4">

  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">Uploaded Excel Reports</h2>
      <div>
        <a href="/dashboard" class="btn btn-outline-light me-2">Dashboard</a>
        <a href="/upload" class="btn btn-primary me-2">Upload Excel</a>
        <a href="/api/logout" class="btn btn-danger">Logout</a>
      </div>
    </div>

    <div class="card card-dark p-3">
      <div class="table-responsive">
        <table class="table table-dark-custom align-middle">
          <thead>
            <tr>
              <th>UPLOAD DATE</th>
              <th>FILE NAME</th>
              <th>TOTAL RECORDS</th>
              <th>PURCHASE / SALE</th>
              <th>CLOSING BAL</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="reportsTableBody">
            <tr>
              <td colspan="6" class="text-center text-muted">Loading reports...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', fetchReports);

    async function fetchReports() {
      try {
        const res = await fetch('/api/excel/reports');
        const data = await res.json();
        
        const tbody = document.getElementById('reportsTableBody');
        tbody.innerHTML = '';

        if (!data.success || !data.reports || data.reports.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No records found.</td></tr>';
          return;
        }

        data.reports.forEach(item => {
          // Safely check variables
          const recordDate = item.recordDate || 'N/A';
          const fileName = item.fileName || 'N/A';
          const totalRows = (item.totalRows !== undefined && item.totalRows !== null) ? item.totalRows : 0;
          const purchase = (item.totalPurchase || 0).toLocaleString('en-IN');
          const sale = (item.totalSale || 0).toLocaleString('en-IN');
          const closing = (item.closingBalance || 0).toLocaleString('en-IN');

          // Check for Opening/Closing Match
          let statusBadge = '';
          if (item.previousClosingMatch === false) {
            statusBadge = '<span class="badge bg-danger">Opening Mismatched</span>';
          } else {
            statusBadge = '<span class="badge bg-success">Matched</span>';
          }

          tbody.innerHTML += `
            <tr>
              <td>${recordDate}</td>
              <td class="fw-bold">${fileName}</td>
              <td>${totalRows} Rows</td>
              <td>
                <span class="text-success">P: ₹${purchase}</span> / 
                <span class="text-danger">S: ₹${sale}</span>
              </td>
              <td class="fw-bold text-info">₹${closing}</td>
              <td>${statusBadge}</td>
            </tr>
          `;
        });

      } catch (err) {
        console.error('Error fetching reports:', err);
        document.getElementById('reportsTableBody').innerHTML = 
          '<tr><td colspan="6" class="text-center text-danger">Failed to load reports.</td></tr>';
      }
    }
  </script>
</body>
</html>
