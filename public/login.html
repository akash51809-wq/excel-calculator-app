<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Metricscape Daybook</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #121319; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-card {
            background: #1a1c24;
            border: 1px solid #282a36;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
        .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #a855f7, #ec4899); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .brand-name { font-size: 20px; font-weight: 700; color: #fff; }

        h3 { text-align: center; font-size: 16px; color: #9ca3af; margin-bottom: 24px; font-weight: 400; }

        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
        
        input {
            width: 100%;
            padding: 12px 16px;
            background: #121319;
            border: 1px solid #282a36;
            border-radius: 10px;
            color: #fff;
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #ec4899; box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2); }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ec4899, #d946ef);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

        #errorMsg { color: #ef4444; font-size: 13px; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">M</div>
            <div class="brand-name">Metricscape</div>
        </div>
        <h3>Daybook Excel Login</h3>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required />
            </div>
            <button type="submit" class="btn-submit">Sign In</button>
        </form>
        <div id="errorMsg"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = data.redirectUrl || '/dashboard';
                } else {
                    errorMsg.innerText = data.message || 'Login failed';
                }
            } catch (err) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
