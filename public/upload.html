<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Excel - DayBook App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-dark { background-color: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
  </style>
</head>
<body>

  <!-- Shared Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4 border-bottom border-secondary">
    <a class="navbar-brand fw-bold text-primary" href="/dashboard">DayBook App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold" href="/upload">Upload Excel</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="reportsDropdown" role="button" data-bs-toggle="dropdown">Reports</a>
          <ul class="dropdown-menu dropdown-menu-dark">
            <li><a class="dropdown-item" href="/reports">All Daily Reports</a></li>
            <li><a class="dropdown-item" href="#" onclick="showUniqueDealersModal()">Show Dealer List</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
      </ul>
      <a href="/api/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
  </nav>

  <div class="container py-4" style="max-width: 650px;">
    <div class="card card-dark p-4 shadow-lg">
      <h4 class="fw-bold mb-3 text-center">📤 Upload Daily Excel Sheet</h4>
      <form id="uploadForm" enctype="multipart/form-data">
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">SELECT RECORD DATE</label>
          <input type="date" id="recordDate" name="recordDate" class="form-control bg-dark text-light border-secondary" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted small fw-bold">TODAY OPENING BALANCE (₹)</label>
          <input type="number" step="0.01" id="openingBalance" name="openingBalance" class="form-control bg-dark text-light border-secondary" placeholder="0.00" required>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted small fw-bold">CHOOSE EXCEL FILE (.XLSX / .XLS)</label>
          <input type="file" id="file" name="file" accept=".xlsx, .xls" class="form-control bg-dark text-light border-secondary" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="uploadBtn">Process & Calculate Excel</button>
      </form>
      <div id="uploadStatus" class="mt-3"></div>
    </div>
  </div>

  <!-- Unique Dealers Submenu Modal -->
  <div class="modal fade" id="dealerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content bg-dark text-light border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold">🏪 Unique Dealer Summary List</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <table class="table table-dark table-striped align-middle">
            <thead>
              <tr><th>#</th><th>Dealer Name</th><th>Total Purchase (₹)</th><th>Total Sale (₹)</th></tr>
            </thead>
            <tbody id="uniqueDealerBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('recordDate').valueAsDate = new Date();

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('uploadBtn');
      const status = document.getElementById('uploadStatus');
      btn.disabled = true;
      btn.innerText = 'Processing Excel File...';
      status.innerHTML = '';

      const formData = new FormData(e.target);
      try {
        const res = await fetch('/api/excel/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          status.innerHTML = '<div class="alert alert-success">Excel Uploaded Successfully! Redirecting...</div>';
          setTimeout(() => window.location.href = '/reports', 1200);
        } else {
          status.innerHTML = `<div class="alert alert-danger">${data.error || 'Upload failed'}</div>`;
        }
      } catch (err) {
        status.innerHTML = '<div class="alert alert-danger">Server processing error</div>';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Process & Calculate Excel';
      }
    });

    async function showUniqueDealersModal() {
      const res = await fetch('/api/excel/reports');
      const data = await res.json();
      const reports = data.reports || [];
      const uniqueDealers = {};

      reports.forEach(report => {
        const breakdown = report.dealerBreakdown || {};
        Object.keys(breakdown).forEach(dKey => {
          const cleanName = dKey.trim();
          if (!uniqueDealers[cleanName]) uniqueDealers[cleanName] = { purchase: 0, sale: 0 };
          uniqueDealers[cleanName].purchase += (breakdown[dKey].purchase || 0);
          uniqueDealers[cleanName].sale += (breakdown[dKey].sale || 0);
        });
      });

      const tbody = document.getElementById('uniqueDealerBody');
      const keys = Object.keys(uniqueDealers);
      tbody.innerHTML = keys.map((dName, i) => `
        <tr>
          <td>${i + 1}</td>
          <td class="fw-bold text-info">${dName}</td>
          <td class="text-success">₹${uniqueDealers[dName].purchase.toLocaleString('en-IN')}</td>
          <td class="text-danger">₹${uniqueDealers[dName].sale.toLocaleString('en-IN')}</td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="text-center text-muted">No Dealer Records Found.</td></tr>';

      new bootstrap.Modal(document.getElementById('dealerModal')).show();
    }
  </script>
</body>
</html>
