<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Excel - Metricscape</title>
    <style>
        :root {
            --bg-body: #111319;
            --bg-sidebar: #181a20;
            --bg-card: #1c1e26;
            --border: #282b36;
            --pink-accent: #e02484;
            --pink-glow: rgba(224, 36, 132, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #8c93a4;
            --green: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #a855f7, var(--pink-accent)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        
        .menu-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; margin: 15px 0 8px 8px; }
        .menu-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
        .menu-item a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; }
        .menu-item.active a { background: var(--pink-accent); color: #fff; box-shadow: 0 4px 12px var(--pink-glow); }
        .menu-item a:hover:not(.active) { background: rgba(255,255,255,0.05); color: #fff; }

        /* Main Content */
        .main-content { flex: 1; padding: 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; max-width: 900px; }
        .header-title { font-size: 22px; font-weight: 700; }
        .header-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        /* Upload Card */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
        .form-sublabel { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; display: block; }

        input[type="date"] {
            width: 100%;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input[type="date"]:focus { border-color: var(--pink-accent); box-shadow: 0 0 0 2px var(--pink-glow); }

        /* File Upload Box */
        .file-drop-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.01);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .file-drop-area:hover { border-color: var(--pink-accent); background: rgba(224, 36, 132, 0.02); }
        .file-drop-area input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        .upload-icon { font-size: 32px; margin-bottom: 8px; color: var(--pink-accent); }
        .file-name { font-size: 13px; color: var(--green); font-weight: 600; margin-top: 8px; }

        .btn-submit {
            background: linear-gradient(135deg, var(--pink-accent), #c026d3);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--pink-glow);
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }

        #statusMsg { font-size: 13px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            <div class="brand-icon">M</div>
            <span>Metricscape</span>
        </div>

        <div class="menu-title">Main Menu</div>
        <ul class="menu-list">
            <li class="menu-item"><a href="/dashboard">Dashboard</a></li>
            <li class="menu-item active"><a href="/upload">Upload Excel</a></li>
            <li class="menu-item"><a href="/reports">Reports</a></li>
        </ul>

        <div class="menu-title" style="margin-top: auto;">Account</div>
        <ul class="menu-list">
            <li class="menu-item"><a href="/login" style="color: var(--pink-accent);">Logout</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div>
            <div class="header-title">Upload Excel File</div>
            <div class="header-desc">Select a date and upload your spreadsheet (.xlsx, .xls) for processing.</div>
        </div>

        <div class="card">
            <form id="excelUploadForm">
                <div class="form-group">
                    <label class="form-label">Select Record Date</label>
                    <input type="date" id="recordDate" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Upload File</label>
                    <span class="form-sublabel">Supported formats: .xlsx, .xls</span>
                    <div class="file-drop-area">
                        <div class="upload-icon">📁</div>
                        <div style="font-size: 14px; font-weight: 500;" id="dropText">Click or Drag & Drop Excel File Here</div>
                        <div class="file-name" id="selectedFileName"></div>
                        <input type="file" id="excelFile" accept=".xlsx, .xls" required />
                    </div>
                </div>

                <button type="submit" class="btn-submit">Process & Save Data</button>
            </form>

            <div id="statusMsg"></div>
        </div>
    </div>

    <script>
        document.getElementById('recordDate').valueAsDate = new Date();

        const fileInput = document.getElementById('excelFile');
        const fileNameDiv = document.getElementById('selectedFileName');
        const dropText = document.getElementById('dropText');

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                fileNameDiv.innerText = "Selected: " + fileInput.files[0].name;
                dropText.style.display = 'none';
            }
        });

        document.getElementById('excelUploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const file = fileInput.files[0];
            const date = document.getElementById('recordDate').value;
            const statusMsg = document.getElementById('statusMsg');

            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('recordDate', date);

            statusMsg.style.color = '#e02484';
            statusMsg.innerText = 'Uploading and processing file...';

            try {
                const res = await fetch('/api/excel/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.success) {
                    statusMsg.style.color = '#10b981';
                    statusMsg.innerText = `Success! Processed ${data.count || 0} rows.`;
                    setTimeout(() => { window.location.href = '/dashboard'; }, 1500);
                } else {
                    statusMsg.style.color = '#e02484';
                    statusMsg.innerText = 'Error: ' + (data.error || 'Upload failed');
                }
            } catch (err) {
                statusMsg.style.color = '#e02484';
                statusMsg.innerText = 'Server connection error.';
            }
        });
    </script>
</body>
</html>
