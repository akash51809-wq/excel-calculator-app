<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dealer Settings - DayBook App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4">
    <a class="navbar-brand fw-bold" href="/dashboard">DayBook App</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/upload">Upload Excel</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="reportsDropdown" role="button" data-bs-toggle="dropdown">Reports</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/reports">All Daily Reports</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link active fw-bold" href="/settings">Settings</a></li>
      </ul>
      <a href="/api/logout" class="btn btn-outline-danger btn-sm">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div class="card p-4 mb-4 shadow-sm border-0">
      <h5 class="fw-bold mb-3">⚙️ Choose Dealer Excel Column Mode</h5>
      <div class="d-flex align-items-center gap-3">
        <span id="leftLabel" class="fw-bold text-success">Dealer Name</span>
        <div class="form-check form-switch m-0">
          <input class="form-check-input" type="checkbox" id="modeToggle" style="width: 3.5em; height: 1.8em; cursor: pointer;" onchange="toggleMode(this)">
        </div>
        <span id="rightLabel" class="fw-bold text-secondary">dealer name/remark</span>
      </div>
    </div>

    <div class="card p-4 mb-4 shadow-sm border-0">
      <h5 class="fw-bold mb-3">Add Dealer & Remark Rules</h5>
      <form id="dealerForm" class="row g-3">
        <div class="col-md-5">
          <input type="text" id="dealerName" class="form-control" placeholder="Dealer Name (e.g. Ramesh Telecom)" required>
        </div>
        <div class="col-md-5">
          <input type="text" id="remarkKeyword" class="form-control" placeholder="dealer name/remark Keyword" required>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">Add Dealer</button>
        </div>
      </form>
    </div>

    <div class="card p-4 shadow-sm border-0">
      <h5 class="fw-bold mb-3">Configured Dealers List</h5>
      <table class="table table-hover align-middle">
        <thead>
          <tr><th>#</th><th>Dealer Name</th><th>dealer name/remark Keyword</th><th>Action</th></tr>
        </thead>
        <tbody id="dealerTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => { loadMode(); loadDealers(); });

    async function loadMode() {
      const res = await fetch('/api/settings/mode');
      const data = await res.json();
      const toggle = document.getElementById('modeToggle');
      toggle.checked = (data.mode === 'remark');
      updateLabels(toggle.checked);
    }

    function updateLabels(isRemark) {
      document.getElementById('leftLabel').className = isRemark ? 'fw-bold text-secondary' : 'fw-bold text-success';
      document.getElementById('rightLabel').className = isRemark ? 'fw-bold text-primary' : 'fw-bold text-secondary';
    }

    async function toggleMode(toggle) {
      const mode = toggle.checked ? 'remark' : 'dealer_name';
      updateLabels(toggle.checked);
      await fetch('/api/settings/mode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode })
      });
    }

    async function loadDealers() {
      const res = await fetch('/api/dealers');
      const dealers = await res.json();
      const tbody = document.getElementById('dealerTableBody');
      tbody.innerHTML = dealers.map((d, i) => `
        <tr>
          <td>${i + 1}</td>
          <td class="fw-bold">${d.dealerName}</td>
          <td><span class="badge bg-secondary">${d.remarkKeyword}</span></td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="deleteDealer('${d._id}')">Delete</button></td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="text-center text-muted">No dealers added yet.</td></tr>';
    }

    document.getElementById('dealerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/dealers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          dealerName: document.getElementById('dealerName').value,
          remarkKeyword: document.getElementById('remarkKeyword').value
        })
      });
      document.getElementById('dealerName').value = '';
      document.getElementById('remarkKeyword').value = '';
      loadDealers();
    });

    async function deleteDealer(id) {
      await fetch(`/api/dealers/${id}`, { method: 'DELETE' });
      loadDealers();
    }
  </script>
</body>
</html>
